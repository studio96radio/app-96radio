# Compilazione automatica dell'app 96 RADIO su Codemagic.
# - "iPhone -> TestFlight": costruisce la versione iPhone e la invia a TestFlight.
# - "Android -> AAB": costruisce la versione Android (AAB per Google Play + APK da
#   installare a mano sui telefoni di prova). Si scarica dalla pagina della build.
workflows:
  ios-testflight:
    name: iPhone -> TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      # Nome della chiave App Store Connect creata in Codemagic
      # (Settings > Integrations > Developer Portal)
      app_store_connect: chiave_96radio
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: it.radio.studio96
      vars:
        VERSIONE: "8.1.0"
    scripts:
      - name: Crea la parte iPhone del progetto
        script: |
          flutter create --org it.radio --project-name studio96 --platforms ios,android .
      - name: Impostazioni iPhone (nome, audio in background, crittografia)
        script: |
          PLIST=ios/Runner/Info.plist
          plutil -replace CFBundleDisplayName -string "96 RADIO" $PLIST
          plutil -replace UIBackgroundModes -json '["audio"]' $PLIST
          plutil -replace ITSAppUsesNonExemptEncryption -bool NO $PLIST
          plutil -lint $PLIST
      - name: Pacchetti e icona
        script: |
          flutter pub get
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create
      - name: Firma dell'app
        script: |
          xcode-project use-profiles
      - name: Compila l'app iPhone
        script: |
          flutter build ipa --release \
            --build-name=$VERSIONE \
            --build-number=$((800 + BUILD_NUMBER)) \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # Solo tester interni: niente invio alla revisione per tester esterni
        submit_to_testflight: false

  android-aab:
    name: Android -> AAB
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      android_signing:
        # Nome della chiave caricata in Codemagic
        # (Settings > Code signing identities > Android keystores)
        - chiave_android_96radio
      vars:
        VERSIONE: "8.1.0"
        # Nome del pacchetto Android: provvisorio finche' non si decide
        # (dipende dalla risposta di Looksomething sul trasferimento)
        PACCHETTO_ANDROID: "it.radio.studio96"
    scripts:
      - name: Crea la parte Android del progetto
        script: |
          flutter create --org it.radio --project-name studio96 --platforms android .
      - name: Impostazioni Android (nome, audio in background, firma, pacchetto)
        script: |
          python3 scripts/android_setup.py
      - name: Pacchetti, icona e schermata di apertura
        script: |
          flutter pub get
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create
      - name: Compila l'app Android
        script: |
          flutter build appbundle --release \
            --build-name=$VERSIONE \
            --build-number=$((800 + BUILD_NUMBER))
          flutter build apk --release \
            --build-name=$VERSIONE \
            --build-number=$((800 + BUILD_NUMBER))
    artifacts:
      - build/app/outputs/bundle/release/*.aab
      - build/app/outputs/flutter-apk/app-release.apk
