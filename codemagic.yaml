# Compilazione automatica dell'app 96 RADIO su Codemagic.
# Ogni avvio: costruisce la versione iPhone e la invia a TestFlight.
workflows:
  ios-testflight:
    name: iPhone -> TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      # Nome della chiave App Store Connect creata in Codemagic
      # (Settings > Integrations > Developer Portal)
      app_store_connect: chiave_96radio
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: it.radio.studio96
      vars:
        VERSIONE: "8.0.0"
    scripts:
      - name: Crea la parte iPhone del progetto
        script: |
          flutter create --org it.radio --project-name studio96 --platforms ios .
      - name: Impostazioni iPhone (nome, audio in background, crittografia)
        script: |
          PLIST=ios/Runner/Info.plist
          plutil -replace CFBundleDisplayName -string "96 RADIO" $PLIST
          plutil -replace UIBackgroundModes -json '["audio"]' $PLIST
          plutil -replace ITSAppUsesNonExemptEncryption -bool NO $PLIST
          plutil -lint $PLIST
      - name: Pacchetti e icona
        script: |
          flutter pub get
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create
      - name: Firma dell'app
        script: |
          xcode-project use-profiles
      - name: Compila l'app iPhone
        script: |
          flutter build ipa --release \
            --build-name=$VERSIONE \
            --build-number=$((800 + BUILD_NUMBER)) \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # Solo tester interni: niente invio alla revisione per tester esterni
        submit_to_testflight: false
